<!doctype html>
<html lang="%sveltekit.lang%" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6356d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CorrelCore" />
    <!-- No external fonts or third-party resources (DSGVO M0 requirement) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <!--
      Inline theme bootstrap: read persisted choice and set data-theme BEFORE
      first paint so we avoid a flash of wrong theme. The theme store reads
      this attribute in getInitial() and stays in sync. Failures (sandboxed
      iframe / disabled storage) silently fall back to the dark default.
    -->
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('correlcore-theme') || localStorage.getItem('moodsync-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            localStorage.setItem('correlcore-theme', saved);
            localStorage.removeItem('moodsync-theme');
            return;
          }
          if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
