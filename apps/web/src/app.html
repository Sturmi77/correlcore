<!doctype html>
<html lang="%sveltekit.lang%" data-theme="skeleton">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#01696f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <!-- No external fonts or third-party resources (DSGVO M0 requirement) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-surface-900">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
