packages:
  - 'apps/*'
  - 'packages/*'

# Build-Script-Allowlist gegen ERR_PNPM_IGNORED_BUILDS auf frischen Branches.
# pnpm verlangt seit 10.x explizite Freigabe fuer Package-Build-Scripts;
# ohne diese Liste bricht der CI-Install ab, sobald esbuild oder es5-ext
# ihre postinstall-Skripte ausfuehren wollen. Beide werden gebraucht:
#   - esbuild laedt sein Native-Binary fuer die jeweilige Plattform
#   - es5-ext registriert Polyfill-Hooks (transitiv ueber die ESLint-Toolchain)
#
# Format: pnpm 11+ verwendet `allowBuilds` (Map). Der pnpm-10-kompatible
# `onlyBuiltDependencies`-Schluessel wurde mit dem Pin auf pnpm 11.0.8
# entfernt (siehe ADR-0010, packageManager-Feld in package.json).
allowBuilds:
  esbuild: true
  es5-ext: true

# Sicherheits-Overrides: erzwinge esbuild ^0.25.0 fuer alle transitiven
# Abhaengigkeiten (svelte-i18n@4.0.1 ist auf esbuild ^0.19.2 gepinnt,
# vite@5.4.21 zieht esbuild 0.21.5 - beide Versionen sind von der
# moderaten Advisory GHSA-67mh-4wv8-2f99 betroffen). Siehe SA-6 im
# M1-Quality-Gate-Report. Issue #69.
#
# Hinweis: Pin auf ^0.25 (nicht >=0.25) - esbuild 0.28+ hat Breaking
# Changes beim Transpilieren von Object-Spread-Destructuring fuer
# legacy Browser-Targets (chrome87/edge88/firefox78/safari14), die
# unseren vite build aktuell brechen. 0.25.x patched die Advisory
# (siehe Release-Notes 0.25.0) und ist API-stabil.
# Transitive Advisories ohne Upstream-Release, das sie schon behebt:
#   - cookie <0.7.0 (GHSA-pxg6-pf52-xh8x) kommt ueber @sveltejs/kit (^0.6.0);
#     0.7.x ist API-kompatibel (parse/serialize).
#   - uuid <11.1.1 (GHSA-w5hq-g745-h8pq) kommt ueber xcode -> @capacitor/cli (^7);
#     ^11 bleibt CommonJS-kompatibel (ab 12 ESM-only, bricht require()).
overrides:
  esbuild: '^0.25.0'
  devalue: '>=5.8.1'
  cookie: '^0.7.0'
  uuid: '^11.1.1'
