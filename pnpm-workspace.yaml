packages:
  - 'apps/*'
  - 'packages/*'

# Build-Script-Allowlist gegen ERR_PNPM_IGNORED_BUILDS auf frischen Branches.
# Seit pnpm 10 verlangt der Installer explizite Freigabe; ohne diese Liste
# bricht der CI-Install ab, sobald esbuild oder es5-ext ihre postinstall-
# Skripte ausfuehren wollen. Beide werden gebraucht:
#   - esbuild laedt sein Native-Binary fuer die jeweilige Plattform
#   - es5-ext registriert Polyfill-Hooks (transitiv ueber die ESLint-Toolchain)
#
# Doppelte Konfiguration fuer pnpm 10 (onlyBuiltDependencies) und pnpm 11+
# (allowBuilds), damit der Fix unabhaengig von der konkreten pnpm-Version
# greift, die `pnpm/action-setup@v4 version: latest` jeweils installiert.
onlyBuiltDependencies:
  - esbuild
  - es5-ext

allowBuilds:
  esbuild: true
  es5-ext: true
