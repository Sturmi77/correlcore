name: CodeQL

# Static application security testing (SAST) for the FE/BE codebase (audit epic
# #776 — "missing external assurance: pentest, SAST"). Complements ci-security.yml
# (gitleaks secrets + dependency audit): CodeQL adds dataflow/taint analysis for
# the two first-party languages. Findings surface in the repo Security tab and as
# PR checks. Free on this public repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so advisories that land in the CodeQL query packs are
    # caught even when the code itself is quiet. Mondays 03:27 UTC.
    - cron: '27 3 * * 1'

# Least privilege by default; the analyze job widens only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload SARIF to code scanning
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode: none — both languages are interpreted, so CodeQL reads
          # the source directly and needs no build step or dependency install.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the higher-signal security queries on top of
          # the default suite (audit epic #776).
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
