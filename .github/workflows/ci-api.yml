name: CI — API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ci-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  UV_VERSION: '0.9.5'

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: Lint (ruff check)
        run: uv run --python 3.12 ruff check .
      - name: Format check (ruff format)
        run: uv run --python 3.12 ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: Typecheck (mypy)
        run: uv run --python 3.12 mypy app

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: Run tests with coverage
        run: uv run --python 3.12 pytest
        env:
          APP_ENV: test
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://:changeme@localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7

  health-smoke:
    name: Health smoke (real Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: correlcore
          POSTGRES_PASSWORD: correlcore
          POSTGRES_DB: correlcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U correlcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: Probe readiness against real services
        run: uv run --python 3.12 pytest tests/test_health_readiness_integration.py -q --no-cov
        env:
          APP_ENV: test
          CORRELCORE_RUN_INTEGRATION: '1'
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://localhost:6379/0'

  integration:
    name: Integration (pytest -m integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: correlcore
          POSTGRES_PASSWORD: correlcore
          POSTGRES_DB: correlcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U correlcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: alembic upgrade head
        run: uv run --python 3.12 alembic -c migrations/alembic.ini upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'
      # One process per module: shared Postgres + leftover RLS/role/revision
      # state from GDPR/RLS suites otherwise bleeds into password_reset/sync.
      - name: pytest -m integration (per-module processes)
        run: |
          set -euo pipefail
          files=(
            tests/test_health_readiness_integration.py
            tests/test_digest_backfill_integration.py
            tests/test_gdpr_delete_integration.py
            tests/test_rls_isolation_integration.py
            tests/test_m7_qa_seed_integration.py
            tests/test_password_reset.py
            tests/test_sync_service.py
          )
          for f in "${files[@]}"; do
            echo "::group::pytest -m integration $f"
            uv run --python 3.12 pytest "$f" -m integration -q --no-cov
            echo "::endgroup::"
          done
        env:
          APP_ENV: test
          CORRELCORE_RUN_INTEGRATION: '1'
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'

  migrations-smoke:
    name: Migrations smoke (alembic upgrade head)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: correlcore
          POSTGRES_PASSWORD: correlcore
          POSTGRES_DB: correlcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U correlcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra analytics --frozen
      - name: alembic upgrade head
        run: uv run --python 3.12 alembic -c migrations/alembic.ini upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://:changeme@localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'
      - name: alembic downgrade base then upgrade head (round-trip)
        run: |
          uv run --python 3.12 alembic -c migrations/alembic.ini downgrade base
          uv run --python 3.12 alembic -c migrations/alembic.ini upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://:changeme@localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'
