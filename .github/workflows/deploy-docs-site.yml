name: Deploy — Docs Site

# Publishes docs-site/ to GitHub Pages on main.
# URL: https://sturmi77.github.io/correlcore/
# Optional custom domain: docs.correlcore.app (add CNAME in repo settings)

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/selfhost/CONTAINER_IMAGES.md'
      - 'docs/selfhost/M10_COMPOSE_UPGRADE.md'
      - '.github/workflows/deploy-docs-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  # Required for the Pages availability pre-check (repos/.../pages).
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Build docs site
        run: mkdocs build --strict
        working-directory: docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages availability
        id: pages_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. Skipping deploy. Enable at https://github.com/${GITHUB_REPOSITORY}/settings/pages (Source: GitHub Actions)."
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
