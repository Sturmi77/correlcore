name: Deploy — Docs Site

# Publishes docs-site/ to GitHub Pages on main.
# URL: https://sturmi77.github.io/correlcore/
# Optional custom domain: docs.correlcore.app (add CNAME in repo settings)

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/selfhost/CONTAINER_IMAGES.md'
      - 'docs/selfhost/M10_COMPOSE_UPGRADE.md'
      - '.github/workflows/deploy-docs-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Build docs site
        run: mkdocs build --strict
        working-directory: docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
