name: Release — Android (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/release-android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/svelte.config.js'
      - 'apps/web/package.json'
      - '.github/workflows/release-android.yml'

jobs:
  validate-capacitor-scaffold:
    name: Validate Capacitor config (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Capacitor scaffold
        run: pnpm --filter @correlcore/android validate

      - name: Assert platform + config files exist
        run: |
          test -f apps/android/capacitor.config.ts
          test -f apps/android/package.json
          test -f apps/android/README.md
          test -f apps/android/android/gradlew
          test -f apps/android/android/app/src/main/AndroidManifest.xml

  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: validate-capacitor-scaffold
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capacitor SPA build + sync
        run: pnpm cap:sync

      - name: Assemble debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: correlcore-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
