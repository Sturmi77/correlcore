name: Release — Android (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/release-android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/svelte.config.js'
      - 'apps/web/package.json'
      - '.github/workflows/release-android.yml'

permissions:
  contents: read

jobs:
  validate-capacitor-scaffold:
    name: Validate Capacitor config (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Capacitor scaffold
        run: pnpm --filter @correlcore/android validate

      - name: Assert platform + config files exist
        run: |
          test -f apps/android/capacitor.config.ts
          test -f apps/android/package.json
          test -f apps/android/README.md
          test -f apps/android/android/gradlew
          test -f apps/android/android/app/src/main/AndroidManifest.xml

  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: validate-capacitor-scaffold
    # Skip duplicate debug build on version tags (signed release job covers tags).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capacitor SPA build + sync
        run: pnpm cap:sync

      - name: Assemble debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: correlcore-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  assemble-release:
    name: Assemble signed release APK/AAB
    runs-on: ubuntu-latest
    needs: validate-capacitor-scaffold
    # Signed builds: version tags, or manual dispatch when keystore secrets exist.
    if: >
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && secrets.ANDROID_KEYSTORE_BASE64 != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capacitor SPA build + sync
        run: pnpm cap:sync

      - name: Derive Android version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            # versionCode: major*1_000_000 + minor*1_000 + patch (semver x.y.z only)
            if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
            else
              CODE="${GITHUB_RUN_NUMBER}"
            fi
            echo "version_name=${VERSION}" >>"$GITHUB_OUTPUT"
            echo "version_code=${CODE}" >>"$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.0-android.${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
            echo "version_code=${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x apps/android/scripts/prepare-release-signing.sh
          apps/android/scripts/prepare-release-signing.sh

      - name: Assemble signed release
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          chmod +x gradlew
          test -n "${ANDROID_KEYSTORE_PATH}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Package artifacts + SHA-256
        id: pkg
        shell: bash
        run: |
          OUT="${RUNNER_TEMP}/android-dist"
          mkdir -p "${OUT}"
          VER="${{ steps.ver.outputs.version_name }}"
          APK_SRC="apps/android/android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="apps/android/android/app/build/outputs/bundle/release/app-release.aab"
          APK_DST="${OUT}/correlcore-${VER}.apk"
          AAB_DST="${OUT}/correlcore-${VER}.aab"
          cp "${APK_SRC}" "${APK_DST}"
          cp "${AAB_SRC}" "${AAB_DST}"
          (
            cd "${OUT}"
            sha256sum "correlcore-${VER}.apk" "correlcore-${VER}.aab" >SHA256SUMS.txt
          )
          echo "dir=${OUT}" >>"$GITHUB_OUTPUT"
          echo "apk=${APK_DST}" >>"$GITHUB_OUTPUT"
          echo "aab=${AAB_DST}" >>"$GITHUB_OUTPUT"
          cat "${OUT}/SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: correlcore-release-android
          path: |
            ${{ steps.pkg.outputs.dir }}/correlcore-*.apk
            ${{ steps.pkg.outputs.dir }}/correlcore-*.aab
            ${{ steps.pkg.outputs.dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.aab }}
            ${{ steps.pkg.outputs.dir }}/SHA256SUMS.txt
          fail_on_unmatched_files: true

      # Put tappable APK/AAB links at the very top of the release notes (mobile UX).
      # Idempotent — also repairs the body if github-release.yml raced this job.
      - name: Prepend Android download links at top of release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/github-release-android-downloads.sh
          scripts/github-release-android-downloads.sh \
            "${GITHUB_REF_NAME}" \
            "${{ steps.ver.outputs.version_name }}"
