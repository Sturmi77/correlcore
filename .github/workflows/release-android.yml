name: Release - Android (Capacitor)

# Debug APK: PRs / main (path-filtered).
# Signed APK/AAB: every v* tag (no path filter) + manual workflow_dispatch.
# IMPORTANT: path filters must NOT apply to tags — otherwise a release tag that
# only bumps docs never builds/attaches the APK (404 on Download links).

on:
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: 'Optional existing release tag to attach APK to (e.g. v1.0.1). Leave empty to only upload Actions artifacts.'
        required: false
        type: string
        default: ''
      vite_api_base_url:
        description: 'Absolute Capacitor API base (https://host/api/v1). Overrides secret/variable VITE_API_BASE_URL for this run.'
        required: false
        type: string
        default: ''
  # No path filters on push: YAML cannot combine "tags always" with
  # "branches + paths" in one mapping. Path filters previously skipped tag
  # builds when the tagged commit did not touch apps/android → 404 APK links.
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/svelte.config.js'
      - 'apps/web/package.json'
      - '.github/workflows/release-android.yml'

permissions:
  contents: read

jobs:
  validate-capacitor-scaffold:
    name: Validate Capacitor config (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Capacitor scaffold
        run: pnpm --filter @correlcore/android validate

      - name: Assert platform + config files exist
        run: |
          test -f apps/android/capacitor.config.ts
          test -f apps/android/package.json
          test -f apps/android/README.md
          test -f apps/android/android/gradlew
          test -f apps/android/android/app/src/main/AndroidManifest.xml

  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: validate-capacitor-scaffold
    # Skip on version tags and on manual "attach to tag" dispatches (signed job covers those).
    if: >
      github.event_name != 'workflow_dispatch'
      && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capacitor SPA build + sync
        env:
          # Optional — bake GlitchTip into the static Capacitor bundle when set.
          PUBLIC_GLITCHTIP_DSN: ${{ secrets.PUBLIC_GLITCHTIP_DSN || secrets.GLITCHTIP_DSN }}
          PUBLIC_GLITCHTIP_ENVIRONMENT: ${{ vars.PUBLIC_GLITCHTIP_ENVIRONMENT || 'android-debug' }}
        run: pnpm cap:sync

      - name: Lint (NewApi — catch java.time on minSdk 23)
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: correlcore-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  assemble-release:
    name: Assemble signed release APK/AAB
    runs-on: ubuntu-latest
    needs: validate-capacitor-scaffold
    # Tags + manual dispatch. Secrets are checked inside the job (not in `if`) —
    # using secrets in job-level `if` has caused this workflow to fail to start.
    if: >
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      # Backfill runs (`attach_to_tag`) must build from that tag's commit, not
      # from the dispatch ref (default `main`) — otherwise newer source lands on
      # an older release and silently replaces correct assets (#451).
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{ github.event.inputs.attach_to_tag != ''
            && format('refs/tags/{0}', github.event.inputs.attach_to_tag)
            || github.ref }}

      - name: Confirm backfill builds from the target tag
        if: github.event.inputs.attach_to_tag != ''
        env:
          ATTACH_TAG: ${{ github.event.inputs.attach_to_tag }}
        run: |
          git fetch --depth=1 origin "refs/tags/${ATTACH_TAG}:refs/tags/${ATTACH_TAG}" 2>/dev/null || true
          TAG_SHA="$(git rev-parse "refs/tags/${ATTACH_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
            echo "::error::Checkout is ${HEAD_SHA}, but ${ATTACH_TAG} points at ${TAG_SHA}."
            exit 1
          fi
          echo "Building ${ATTACH_TAG} from ${HEAD_SHA}."

      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Missing repository secret: ${v}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Add ANDROID_* secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Capacitor API base URL
        id: api_base
        env:
          INPUT_API_BASE: ${{ github.event.inputs.vite_api_base_url }}
          SECRET_API_BASE: ${{ secrets.VITE_API_BASE_URL }}
          VAR_API_BASE: ${{ vars.VITE_API_BASE_URL }}
        run: |
          # Prefer workflow_dispatch input, then secret, then repository variable.
          CANDIDATE="${INPUT_API_BASE:-}"
          if [[ -z "${CANDIDATE}" ]]; then CANDIDATE="${SECRET_API_BASE:-}"; fi
          if [[ -z "${CANDIDATE}" ]]; then CANDIDATE="${VAR_API_BASE:-}"; fi
          if [[ -z "${CANDIDATE}" ]]; then
            echo "::error::Missing VITE_API_BASE_URL. Set repository secret/variable VITE_API_BASE_URL or pass workflow_dispatch input vite_api_base_url (absolute https://host/api/v1)."
            exit 1
          fi
          # Write the output BEFORE masking — GitHub drops masked values from
          # GITHUB_OUTPUT if ::add-mask runs first (see context/output docs).
          echo "value=${CANDIDATE}" >>"$GITHUB_OUTPUT"
          echo "::add-mask::${CANDIDATE}"

      - name: Assert absolute Capacitor API base
        env:
          VITE_API_BASE_URL: ${{ steps.api_base.outputs.value }}
        run: node scripts/assert-capacitor-api-base.mjs

      - name: Capacitor SPA build + sync
        env:
          VITE_API_BASE_URL: ${{ steps.api_base.outputs.value }}
          # Optional — Capacitor is adapter-static; PUBLIC_* must be present at build time.
          PUBLIC_GLITCHTIP_DSN: ${{ secrets.PUBLIC_GLITCHTIP_DSN || secrets.GLITCHTIP_DSN }}
          PUBLIC_GLITCHTIP_ENVIRONMENT: ${{ vars.PUBLIC_GLITCHTIP_ENVIRONMENT || 'android' }}
        run: pnpm cap:sync

      - name: Derive Android version from tag
        id: ver
        shell: bash
        run: |
          ATTACH_TAG="${{ github.event.inputs.attach_to_tag }}"
          # attach_to_tag wins over the dispatch ref: the checkout above already
          # builds that tag's commit, so deriving the name from GITHUB_REF would
          # upload binaries built from one tag onto a different release (#451).
          if [[ -n "${ATTACH_TAG}" ]]; then
            TAG="${ATTACH_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=""
          fi

          if [[ -n "${TAG}" ]]; then
            VERSION="${TAG#v}"
            if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-.].*)?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
            else
              CODE="${GITHUB_RUN_NUMBER}"
            fi
            echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
            echo "version_name=${VERSION}" >>"$GITHUB_OUTPUT"
            echo "version_code=${CODE}" >>"$GITHUB_OUTPUT"
          else
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "version_name=1.0.0-android.${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
            echo "version_code=${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x apps/android/scripts/prepare-release-signing.sh
          apps/android/scripts/prepare-release-signing.sh

      - name: Assemble signed release
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          chmod +x gradlew
          test -n "${ANDROID_KEYSTORE_PATH}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Package artifacts + SHA-256
        id: pkg
        shell: bash
        run: |
          OUT="${RUNNER_TEMP}/android-dist"
          mkdir -p "${OUT}"
          VER="${{ steps.ver.outputs.version_name }}"
          APK_SRC="apps/android/android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="apps/android/android/app/build/outputs/bundle/release/app-release.aab"
          APK_DST="${OUT}/correlcore-${VER}.apk"
          AAB_DST="${OUT}/correlcore-${VER}.aab"
          cp "${APK_SRC}" "${APK_DST}"
          cp "${AAB_SRC}" "${AAB_DST}"
          (
            cd "${OUT}"
            sha256sum "correlcore-${VER}.apk" "correlcore-${VER}.aab" >SHA256SUMS.txt
          )
          echo "dir=${OUT}" >>"$GITHUB_OUTPUT"
          echo "apk=${APK_DST}" >>"$GITHUB_OUTPUT"
          echo "aab=${AAB_DST}" >>"$GITHUB_OUTPUT"
          cat "${OUT}/SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: correlcore-release-android
          path: |
            ${{ steps.pkg.outputs.dir }}/correlcore-*.apk
            ${{ steps.pkg.outputs.dir }}/correlcore-*.aab
            ${{ steps.pkg.outputs.dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.aab }}
            ${{ steps.pkg.outputs.dir }}/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Prepend Android download links at top of release notes
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/github-release-android-downloads.sh
          scripts/github-release-android-downloads.sh \
            "${{ steps.ver.outputs.tag }}" \
            "${{ steps.ver.outputs.version_name }}"
