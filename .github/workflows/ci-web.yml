name: CI — Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci-web.yml'

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    name: Lint (ESLint + svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: ESLint + svelte-check
        run: pnpm lint

  format:
    name: Format auto-fix (Prettier)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Prettier write
        run: pnpm format
        working-directory: .

      - name: Commit auto-fix (push only)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Already formatted, nothing to commit." && exit 0
          git add -A
          git commit -m "style: prettier auto-fix [skip ci]"
          git push
        working-directory: .

      - name: Prettier check (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm format:check
        working-directory: .

  typecheck:
    name: Typecheck (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Vitest
        run: pnpm test

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: '/api/v1'

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke flow
        run: pnpm test:e2e:smoke
        env:
          VITE_API_BASE_URL: '/api/v1'
