name: CI — Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'packages/**'
      - 'scripts/check-contrast.mjs'
      - 'scripts/check-style-contract.mjs'
      - 'scripts/check-style-tokens.mjs'
      - 'scripts/check-no-token-storage.mjs'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'packages/**'
      - 'scripts/check-contrast.mjs'
      - 'scripts/check-style-contract.mjs'
      - 'scripts/check-style-tokens.mjs'
      - 'scripts/check-no-token-storage.mjs'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci-web.yml'

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    name: Lint (ESLint + svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: ESLint + svelte-check
        run: pnpm lint

  format:
    name: Format auto-fix (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Prettier write
        run: pnpm format
        working-directory: .

      - name: Commit auto-fix (push only)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Already formatted, nothing to commit." && exit 0
          git add -A
          git commit -m "style: prettier auto-fix [skip ci]"
          git push
        working-directory: .

      - name: Prettier check (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm format:check
        working-directory: .

  typecheck:
    name: Typecheck (svelte-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

  contrast:
    name: Contrast check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Contrast check
        run: pnpm check:contrast
        working-directory: .

  style-contract:
    name: Style contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Style contract check
        run: pnpm check:style-contract
        working-directory: .

  style-tokens:
    name: Style token guardrail (F-21)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Style token check
        run: pnpm check:style-tokens
        working-directory: .

  no-token-storage:
    name: Web storage guardrail (ADR-0006)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # ADR-0006 / #453: refresh material belongs in HttpOnly cookies (Web/PWA)
      # or EncryptedSharedPreferences (Capacitor) — never in web storage.
      - name: Web storage check
        run: pnpm check:no-token-storage
        working-directory: .

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Vitest
        run: pnpm test

  coverage:
    name: Coverage floor (lib/api + offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # Enforces the non-regression coverage floor on the schema-sensitive client
      # surface (src/lib/api + src/lib/offline). Thresholds live in
      # apps/web/vite.config.ts (#780, audit Q4/Q5).
      - name: Vitest coverage
        run: pnpm test:coverage

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: '/api/v1'

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    # Guardrail: production webServer (pnpm build && node build) needs headroom
    # beyond the old 15m cap. Fail fast so a flake is a quick re-run (#732).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke flow
        run: pnpm test:e2e:smoke
        env:
          VITE_API_BASE_URL: '/api/v1'
          PLAYWRIGHT_WEB_SERVER: production

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
