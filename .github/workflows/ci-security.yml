name: CI - Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: '0.9.5'

jobs:
  secret-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan working tree and Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (pip-audit + pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Backend pip-audit
        working-directory: backend
        run: |
          uv sync --python 3.12 --extra dev --extra analytics --frozen
          # ecdsa via python-jose: HS256-only JWT (ADR-0004); no upstream fix (PYSEC-2026-1325)
          # pip 26.1.2 (build tool only, not shipped in the runtime image); fix 26.2 not yet in the pinned toolchain (PYSEC-2026-3721)
          uv run --python 3.12 pip-audit --skip-editable --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-3721

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frontend pnpm audit (production)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
