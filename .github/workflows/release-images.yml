name: Release — Container Images

# Builds and publishes correlcore-api and correlcore-web (multi-arch).
# - Push to main → :latest + :main + :sha-<short>
# - Tag v* (e.g. v1.0.0) → :v1.0.0 + :v1.0 + :latest
# - manual dispatch → same tag rules as branch/tag context
#
# Registries:
# - GHCR (always): ghcr.io/<owner>/correlcore-{api,web}
# - Docker Hub (when secrets set): docker.io/<DOCKERHUB_USERNAME>/correlcore-{api,web}
#
# Required repo secrets for Docker Hub (M10 Sprint 2):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (read/write access token)
#
# GHCR push requires: Settings → Actions → Workflow permissions → read/write packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    # Since ADR-0011 (internal reverse proxy in apps/web/src/hooks.server.ts)
    # VITE_API_BASE_URL=/api/v1 is the only supported build-time config.
    # Runtime topology uses INTERNAL_API_URL on the web container.

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: correlcore-api
            context: backend
            dockerfile: backend/Dockerfile
            cache_scope: api
          - image: correlcore-web
            context: .
            dockerfile: apps/web/Dockerfile
            cache_scope: web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Secrets cannot be referenced in step `if:` expressions — detect via env instead.
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image targets
        id: targets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="${{ github.repository_owner }}"
          name="${{ matrix.image }}"
          {
            echo "images<<EOF"
            echo "ghcr.io/${owner}/${name}"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/${name}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build metadata (api)
        if: matrix.image == 'correlcore-api'
        id: build_meta
        shell: bash
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push api
        if: matrix.image == 'correlcore-api'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      - name: Build & push web
        if: matrix.image == 'correlcore-web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
          provenance: false
          build-args: |
            VITE_API_BASE_URL=/api/v1
