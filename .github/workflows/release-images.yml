name: Release — Container Images

# Builds and publishes correlcore-api and correlcore-web (multi-arch).
# - Push to main → :latest + :main + :sha-<short>
# - Tag v* (e.g. v1.0.0) → :v1.0.0 + :v1.0 + :latest
# - manual dispatch → same tag rules as branch/tag context
# - Push to main / dispatch also aliases any bare-semver tags still on the
#   registry (:1.3.0) to the documented v-prefixed names (:v1.3.0). Needed
#   because Actions runs the workflow file from the *tagged* commit — re-running
#   an old v* tag build cannot pick up the v{{version}} pattern fix on main.
#
# Registries:
# - GHCR (always): ghcr.io/<owner>/correlcore-{api,web}
# - Docker Hub (when secrets set): docker.io/<DOCKERHUB_USERNAME>/correlcore-{api,web}
#
# Required repo secrets for Docker Hub (M10 Sprint 2):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (read/write access token)
#
# GHCR push requires: Settings → Actions → Workflow permissions → read/write packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    # Since ADR-0011 (internal reverse proxy in apps/web/src/hooks.server.ts)
    # VITE_API_BASE_URL=/api/v1 is the only supported build-time config.
    # Runtime topology uses INTERNAL_API_URL on the web container.

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64
  UV_VERSION: '0.9.5'

jobs:
  preflight:
    name: Preflight (pytest + web build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Backend pytest
        working-directory: backend
        run: |
          uv sync --python 3.12 --extra dev --extra analytics --frozen
          uv run --python 3.12 pytest --no-cov -q
        env:
          APP_ENV: test
          DATABASE_URL: 'postgresql+asyncpg://correlcore:correlcore@localhost:5432/correlcore'
          REDIS_URL: 'redis://:changeme@localhost:6379/0'
          SECRET_KEY: 'test-secret-key-min-32-bytes-long-padding'
          ENCRYPTION_KEY: 'SFt_zAqsk202KSZePwlHDy3TkhiHG1rFDBePciArND4='
          SLUG_HMAC_KEY: 'ci-slug-hmac-key-for-correlcore-tests-32b'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.0.8'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Web build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @correlcore/web build
        env:
          VITE_API_BASE_URL: '/api/v1'

  build:
    name: Build & Push ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: correlcore-api
            context: backend
            dockerfile: backend/Dockerfile
            cache_scope: api
          - image: correlcore-web
            context: .
            dockerfile: apps/web/Dockerfile
            cache_scope: web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Secrets cannot be referenced in step `if:` expressions — detect via env instead.
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image targets
        id: targets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="${{ github.repository_owner }}"
          name="${{ matrix.image }}"
          {
            echo "images<<EOF"
            echo "ghcr.io/${owner}/${name}"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/${name}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build metadata (api)
        if: matrix.image == 'correlcore-api'
        id: build_meta
        shell: bash
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.targets.outputs.images }}
          # v-prefixed semver on purpose: docs / compose use IMAGE_TAG=v1.5.0 and
          # the git tags are v*. metadata-action's default type=semver strips the
          # leading v (→ :1.3.0), which 404s against the documented pull path. Do
          # not "simplify" the patterns back to {{version}} / {{major}}.{{minor}}.
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push api
        if: matrix.image == 'correlcore-api'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      - name: Build & push web
        if: matrix.image == 'correlcore-web'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
          provenance: false
          build-args: |
            VITE_API_BASE_URL=/api/v1

  # Historical releases published bare semver (:1.3.0) while docs pin :v1.3.0.
  # #667 fixed future tag builds on main, but re-cutting an old git tag still
  # executes the workflow at that tag's commit (pre-fix patterns). Alias the
  # existing multi-arch indexes instead of rebuilding or force-moving tags.
  alias-v-prefix:
    name: Alias bare semver → v-prefixed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Discover bare semver tags and alias to v-prefixed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          # Package REST owner segment can differ by case; prefer lowercase, fall back.
          versions_json="$(mktemp)"
          if ! gh api --paginate \
              "/users/${owner_lc}/packages/container/correlcore-api/versions" \
              >"${versions_json}" 2>/dev/null; then
            gh api --paginate \
              "/users/${{ github.repository_owner }}/packages/container/correlcore-api/versions" \
              >"${versions_json}"
          fi
          # Match bare X.Y / X.Y.Z and prerelease X.Y.Z-<pre> (e.g. 1.0.0-rc.1),
          # which docker/metadata-action also published without the leading v.
          # The digits.digits anchor still excludes latest / main / sha-<...>.
          # grep exits 1 on no match — do not fail the job when every tag is already v-prefixed.
          mapfile -t bare_tags < <(
            jq -r '.[].metadata.container.tags[]?' "${versions_json}" \
              | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+(-[0-9A-Za-z.-]+)?)?$' \
              | sort -u \
              || true
          )
          rm -f "${versions_json}"
          if [[ "${#bare_tags[@]}" -eq 0 || -z "${bare_tags[0]:-}" ]]; then
            echo "No bare semver tags found to alias."
            exit 0
          fi
          echo "Bare semver tags: ${bare_tags[*]}"
          registries="ghcr.io/${owner_lc}"
          if [[ "${DOCKERHUB_ENABLED}" == "true" && -n "${DOCKERHUB_USERNAME}" ]]; then
            registries="${registries} docker.io/${DOCKERHUB_USERNAME}"
          fi
          chmod +x scripts/alias-v-prefix-image-tags.sh
          REGISTRIES="${registries}" \
            SOURCE_TAGS="${bare_tags[*]}" \
            ./scripts/alias-v-prefix-image-tags.sh
