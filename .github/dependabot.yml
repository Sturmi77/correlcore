# Dependency updates for the pnpm workspace + backend uv/pip lock.
# Security CI still runs pip-audit / pnpm audit; Dependabot opens PRs for bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # eslint-plugin-svelte v3 is a breaking major: it revamps the recommended
      # ruleset and surfaces ~215 new lint errors across the existing Svelte
      # code. Defer it to a dedicated migration instead of a routine bump; v2.x
      # minor/patch updates still flow. See closed PR #751.
      - dependency-name: 'eslint-plugin-svelte'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: '/backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # python-jose pulls ecdsa; HS256-only usage is documented in M9_PENTEST.
    # Leave ignore empty so advisories stay visible; CI may still accept known ones.

  - package-ecosystem: docker
    directory: '/backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: '/apps/web'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
