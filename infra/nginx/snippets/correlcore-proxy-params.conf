# CorrelCore — shared proxy parameters (ADR-0040).
#
# Included by EVERY location that proxies to correlcore-web so auth endpoints
# can NEVER diverge from the rest of the app. Divergence here is exactly what
# silently drops the login Set-Cookie and makes a correct login render as
# "E-Mail oder Passwort ist falsch" (see ADR-0040).
#
# Install to: /etc/nginx/snippets/correlcore-proxy-params.conf

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;   # TLS terminates at this edge; upstream is HTTP
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";        # enable upstream keepalive

proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Auth cookies MUST survive this hop untouched. Do NOT add either of these —
# both break login and reintroduce the ADR-0040 class of bug:
#   proxy_hide_header Set-Cookie;   # would strip the session cookie
#   proxy_cookie_path ...;          # would rewrite the Path=/api scoping
