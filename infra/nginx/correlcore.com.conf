# CorrelCore — canonical hosted Nginx edge (ADR-0040).
#
# This supersedes the inline example in docs/runbooks/hosted-nginx-edge.md.
#
# Contract (ADR-0040 "one-rule passthrough"):
#   This edge ONLY (1) terminates TLS and (2) reverse-proxies ALL paths to the
#   correlcore-web container. The web container owns /api routing and the
#   Set-Cookie response (ADR-0011). There is deliberately NO per-path /api rule
#   and NO direct API routing. Both location blocks below include the SAME
#   proxy-params snippet, so auth requests can never be handled differently from
#   the rest of the app — that divergence is what drops the login cookie.
#
# Adjust before use:
#   - server_name / ssl_certificate* to your host + ACME setup
#   - the upstream port (WEB_HOST_PORT; Dockhand default 3010)
#
# After reload, ALWAYS verify with:  scripts/verify-auth-cookie.sh
#
# Install to: /etc/nginx/sites-available/correlcore.com.conf (symlink into
# sites-enabled/), plus snippets/correlcore-proxy-params.conf into
# /etc/nginx/snippets/.

# --- http{} context: rate-limit zone + upstream (top of an included conf) ---
limit_req_zone $binary_remote_addr zone=correlcore_auth:10m rate=5r/s;

upstream correlcore_web {
    server 127.0.0.1:3010;   # WEB_HOST_PORT (bind web to loopback; only Nginx is public)
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name correlcore.com www.correlcore.com;
    return 301 https://correlcore.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name correlcore.com www.correlcore.com;

    # ssl_certificate     /etc/letsencrypt/live/correlcore.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/correlcore.com/privkey.pem;

    # Security headers (parity with the Traefik labels in the production compose).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;

    # Auth endpoints: SAME proxy behaviour as everything else, PLUS a rate limit.
    # The shared include GUARANTEES identical header/cookie handling to `location /`.
    location /api/v1/auth/ {
        limit_req zone=correlcore_auth burst=20 nodelay;
        proxy_pass http://correlcore_web;
        include /etc/nginx/snippets/correlcore-proxy-params.conf;
    }

    # Everything else — landing, app, /api, static assets → web container.
    location / {
        proxy_pass http://correlcore_web;
        include /etc/nginx/snippets/correlcore-proxy-params.conf;
    }
}
