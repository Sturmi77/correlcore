# CorrelCore — canonical hosted Nginx edge (ADR-0040).
#
# This supersedes the inline example in docs/runbooks/hosted-nginx-edge.md.
#
# Self-contained: ONE file, no include snippet — deployable on a standalone
# reverse-proxy machine (or pasteable into a Synology custom config) where you
# cannot drop extra files into /etc/nginx/snippets/.
#
# Contract (ADR-0040 "one-rule passthrough"):
#   This edge ONLY (1) terminates TLS and (2) reverse-proxies ALL paths to the
#   correlcore-web container. The web container owns /api routing and the
#   Set-Cookie response (ADR-0011). There is deliberately NO per-path /api rule
#   and NO direct API routing.
#
# Why the proxy params live at server{} level:
#   nginx inherits `proxy_set_header` into a location ONLY IF that location
#   defines none of its own. Both locations below add none, so they inherit the
#   IDENTICAL set defined once here — auth requests can never be proxied
#   differently from the rest of the app (the divergence that drops the login
#   Set-Cookie). Do NOT add a `proxy_set_header` inside a location block: that
#   wipes ALL inherited ones there and reintroduces the bug.
#
# Adjust before use:
#   - server_name / ssl_certificate* to your host + ACME setup
#   - the upstream target (see note below)
#
# After reload, ALWAYS verify:  BASE_URL=https://correlcore.com scripts/verify-auth-cookie.sh

# --- http{} context: rate-limit zone + upstream (top of an included conf) ---
limit_req_zone $binary_remote_addr zone=correlcore_auth:10m rate=5r/s;

upstream correlcore_web {
    # If Nginx runs on the SAME host as the web container: 127.0.0.1:3010.
    # If Nginx runs on a SEPARATE machine: the app host reachable from here.
    #
    # SECURITY: TLS terminates at this edge, so `proxy_pass http://…` below sends
    # login credentials, session cookies and API data to the app host in
    # PLAINTEXT. A remote edge is only safe when that hop is itself encrypted —
    # a Tailscale/WireGuard tailnet, a VPN, or a private point-to-point segment.
    # Do NOT point this at a plain LAN/WAN address over an untrusted network. If
    # the link can't be trusted, terminate TLS on the app host too and switch the
    # locations to `proxy_pass https://correlcore_web;` with proxy_ssl_verify on.
    server 127.0.0.1:3010;   # <-- APP_HOST:WEB_PORT for a remote edge (trusted link only)
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name correlcore.com www.correlcore.com;
    return 301 https://correlcore.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name correlcore.com www.correlcore.com;

    # ssl_certificate     /etc/letsencrypt/live/correlcore.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/correlcore.com/privkey.pem;

    # Security headers (parity with the Traefik labels in the production compose).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;

    # --- Shared proxy params (ADR-0040) — defined ONCE, inherited by every -----
    # --- location below because none of them declare their own -----------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # TLS terminates here; upstream is HTTP
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";        # enable upstream keepalive
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # REQUIRED: the SvelteKit web container emits large response headers
    # (adapter-node `Link: rel=preload` for every JS/CSS chunk). nginx's default
    # proxy_buffer_size (4k/8k) is too small → the edge returns
    # "502 Bad Gateway" with `upstream sent too big header while reading
    # response header from upstream` in the error log. Raise the header buffer.
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # Auth cookies MUST pass through untouched — do NOT add either of these:
    #   proxy_hide_header Set-Cookie;   # would strip the session cookie
    #   proxy_cookie_path ...;          # would rewrite the Path=/api scoping

    # Auth endpoints: SAME proxy behaviour (inherited above) PLUS a rate limit.
    # NOTE: adding a `proxy_set_header` here would drop all inherited ones.
    location /api/v1/auth/ {
        limit_req zone=correlcore_auth burst=20 nodelay;
        proxy_pass http://correlcore_web;
    }

    # Everything else — landing, app, /api, static assets → web container.
    location / {
        proxy_pass http://correlcore_web;
    }
}
