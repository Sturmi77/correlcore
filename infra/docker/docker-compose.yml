# CorrelCore — Docker Compose Stack (Production VPS)
# M10 Sprint 1: migrate init, YAML-DRY, MinIO removed (photos → M13).
# Security hardening: socket-proxy [SEC-03], Redis auth [SEC-01], Traefik headers [SEC-05].
#
# Start: docker compose up -d
# Optional: docker compose --profile monitoring up -d
# Upgrade guide: docs/selfhost/M10_COMPOSE_UPGRADE.md

name: correlcore

x-api-image: &api-image
  image: ${IMAGE_REGISTRY:-ghcr.io/sturmi77}/correlcore-api:${IMAGE_TAG:-latest}

x-web-image: &web-image
  image: ${IMAGE_REGISTRY:-ghcr.io/sturmi77}/correlcore-web:${IMAGE_TAG:-latest}

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  SLUG_HMAC_KEY: ${SLUG_HMAC_KEY:?SLUG_HMAC_KEY must be set}
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-correlcore_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-correlcore}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  RATE_LIMIT_STORAGE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  RATE_LIMIT_TRUST_PROXY_HEADERS: 'true'
  CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@${DOMAIN}}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${DOMAIN}}
  UNVERIFIED_CLEANUP_DAYS: ${UNVERIFIED_CLEANUP_DAYS:-7}
  DEV_VIEW_ENABLED: ${DEV_VIEW_ENABLED:-false}
  IMAGE_TAG: ${IMAGE_TAG:-latest}
  IMAGE_DIGEST: ${IMAGE_DIGEST:-}
  GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
  GLITCHTIP_ENVIRONMENT: ${APP_ENV:-production}

services:
  # ── Docker Socket Proxy ────────────────────────────────────────────────────
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: correlcore-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: correlcore-traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/etc/traefik/acme
    depends_on:
      - socket-proxy
    networks:
      - edge
      - socket
    security_opt:
      - no-new-privileges:true
    labels:
      - 'traefik.http.middlewares.security-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.security-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.security-headers.headers.forceSTSHeader=true'
      - 'traefik.http.middlewares.security-headers.headers.frameDeny=true'
      - 'traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.security-headers.headers.browserXssFilter=true'
      - 'traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin'
      - 'traefik.http.middlewares.security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()'
      - 'traefik.http.middlewares.redirect-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.redirect-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)'
      - 'traefik.http.routers.http-catchall.entrypoints=web'
      - 'traefik.http.routers.http-catchall.middlewares=redirect-https'

  # ── Migrations-Init ────────────────────────────────────────────────────────
  migrate:
    <<: *api-image
    container_name: correlcore-migrate
    command: ['alembic', 'upgrade', 'head']
    env_file: .env
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-correlcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-correlcore}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'
    security_opt:
      - no-new-privileges:true

  # ── Backend API ────────────────────────────────────────────────────────────
  api:
    <<: *api-image
    container_name: correlcore-api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.api.entrypoints=websecure'
      - 'traefik.http.routers.api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.api.middlewares=security-headers'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.average=100'
      - 'traefik.http.middlewares.api-ratelimit.ratelimit.burst=50'
      - 'traefik.http.routers.api.middlewares=security-headers,api-ratelimit'
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000/health/live || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Web Frontend ───────────────────────────────────────────────────────────
  web:
    <<: *web-image
    container_name: correlcore-web
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:8000
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${APP_ENV:-production}
      PUBLIC_GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      PUBLIC_GLITCHTIP_ENVIRONMENT: ${APP_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.web.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.web.entrypoints=websecure'
      - 'traefik.http.routers.web.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.web.middlewares=security-headers'
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 > /dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Analytics Worker ───────────────────────────────────────────────────────
  worker:
    <<: *api-image
    container_name: correlcore-worker
    restart: unless-stopped
    command: ['python', '-m', 'app.workers.analytics']
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # ── Weekly Digest Worker (opt-in profile) ──────────────────────────────────
  # Enable with COMPOSE_PROFILES=digest (or combine: worker,digest).
  # Sleeps until Sunday 17:00 UTC, then runs app.workers.digest.
  digest-worker:
    <<: *api-image
    container_name: correlcore-digest-worker
    restart: unless-stopped
    command: ['python', '-m', 'app.workers.digest']
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - digest
    security_opt:
      - no-new-privileges:true

  # ── Datenbank ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: correlcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correlcore}
      POSTGRES_USER: ${POSTGRES_USER:-correlcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-correlcore_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-correlcore} -d ${POSTGRES_DB:-correlcore}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # ── Cache & Queue ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: correlcore-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # ── MailPit (Dev SMTP — Issue #39) ───────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: correlcore-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:8025:8025'
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Monitoring (optional, --profile monitoring) ────────────────────────────
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: correlcore-glitchtip
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-correlcore}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: https://errors.${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.glitchtip.rule=Host(`errors.${DOMAIN}`)'
      - 'traefik.http.routers.glitchtip.entrypoints=websecure'
      - 'traefik.http.routers.glitchtip.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.glitchtip.middlewares=security-headers'
    networks:
      - internal
      - edge
    profiles:
      - monitoring
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8000/ > /dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  traefik_certs:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  socket:
    driver: bridge
