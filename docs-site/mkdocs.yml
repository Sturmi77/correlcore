site_name: CorrelCore Documentation
site_description: Selfhost install guide, user workflows, and API overview for CorrelCore
site_url: https://sturmi77.github.io/correlcore/
repo_url: https://github.com/Sturmi77/correlcore
repo_name: Sturmi77/correlcore
edit_uri: edit/main/docs-site/docs/

copyright: Copyright &copy; CorrelCore contributors

theme:
  name: material
  language: en
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install:
      - Overview: install/index.md
      - Container images: install/container-images.md
      - Upgrade guide: install/upgrade.md
  - User guide: user-guide/index.md
  - API overview: api/overview.md
  - Privacy: privacy/index.md

strict: true
