[project]
name = "correlcore-backend"
version = "1.6.0"
description = "CorrelCore FastAPI backend"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
  # Web framework
  "fastapi>=0.111.0",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.31",
  # Database
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.1.0",
  "alembic>=1.13.0",
  # Redis
  "redis>=5.0.0",
  # Validation / settings
  "pydantic>=2.7.0",
  "pydantic-settings>=2.14.2",
  "email-validator>=2.2.0",
  # Auth (Phase 1: native JWT — ADR-0004)
  "python-jose[cryptography]>=3.3.0",
  # Hash/verify via bcrypt directly (passlib's wrap self-test breaks on bcrypt≥4.1).
  "bcrypt>=4.0.1,<6.0.0",
  # Encryption at-rest (ADR-0005). Floor raised to 50.0.0 for PYSEC-2026-3552 (#655).
  "cryptography>=50.0.0",
  # Photo metadata strip (Issue #28, M13 foundation)
  "pillow>=10.4.0",
  # Email (async SMTP — Issue #39)
  "aiosmtplib>=5.1.1",
  "jinja2>=3.1.0",
  # Rate limiting
  "slowapi>=0.1.9",
  "sentry-sdk[fastapi]>=2.19.0",
]

[project.optional-dependencies]
# Analytics / Insights worker (M3).
# Installed in API runtime and CI from the M3 foundation sprint onward so
# schema and worker follow-ups exercise the same dependency surface as deploys.
analytics = [
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  "apscheduler>=3.10.0",
  "ruptures>=1.1.9",
  # Optional Ollama statement refinement (#148) — also used by FastAPI TestClient in tests
  "httpx>=0.27.0",
]
# Firebase Cloud Messaging for Play/SaaS (M11 Sprint 5). Not required for
# selfhost or F-Droid-bound sideload builds.
fcm = [
  "firebase-admin>=6.5.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/deps/auth.py" = ["B008"]
"app/api/v1/endpoints/admin.py" = ["B008"]
"app/api/v1/endpoints/auth.py" = ["B008"]
"app/api/v1/endpoints/analysis.py" = ["B008"]
"app/api/v1/endpoints/dashboard.py" = ["B008"]
"app/api/v1/endpoints/dev.py" = ["B008"]
"app/api/v1/endpoints/entries.py" = ["B008"]
"app/api/v1/endpoints/export.py" = ["B008"]
"app/api/v1/endpoints/habits.py" = ["B008"]
"app/api/v1/endpoints/health_connect.py" = ["B008"]
"app/api/v1/endpoints/insights.py" = ["B008"]
"app/api/v1/endpoints/media.py" = ["B008"]
"app/api/v1/endpoints/note_markers.py" = ["B008"]
"app/api/v1/endpoints/note_signals.py" = ["B008"]
"app/api/v1/endpoints/onboarding.py" = ["B008"]
"app/api/v1/endpoints/sync.py" = ["B008"]
"app/api/v1/endpoints/tags.py" = ["B008"]
"app/api/v1/endpoints/symptoms.py" = ["B008"]
"app/api/v1/endpoints/user.py" = ["B008"]
"app/api/v1/endpoints/widget.py" = ["B008"]
"app/api/v1/endpoints/devices.py" = ["B008"]
"app/api/v1/endpoints/worker_status.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=70"
markers = [
  "integration: tests that require external services such as PostgreSQL or Redis",
  "no_rest_revision_stub: exercise real REST→revision-log helpers (skip MagicMock stub)",
]

[tool.uv]
override-dependencies = [
  "idna>=3.15",
]
